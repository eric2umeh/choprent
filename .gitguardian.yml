# GitGuardian — known false positives in auth UI.
# HTML autocomplete tokens are not secrets. Real credentials live in .env.local (gitignored).
# See docs/11_security_env_and_git.md

version: 2

secret:
  ignored_paths:
    - "apps/web/src/components/auth/**"
    - "apps/web/src/lib/auth/autocomplete.ts"

  ignored_matches:
    - name: HTML autocomplete token (sign-up)
      match: new-password
    - name: HTML autocomplete token (sign-in)
      match: current-password
